services:
  horizn:
    build: .
    container_name: horizn
    ports:
      - "3003:3003"
    volumes:
      - ./json:/app/json:ro
      - ./data:/app/data
      - ./js/cache:/app/js/cache
      - ./.env:/app/.env:ro
    environment:
      - PORT=3003
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3003/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - heartbeat-net
    restart: unless-stopped

networks:
  heartbeat-net:
    external: true
