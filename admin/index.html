<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HORIZN · Monitor</title>
<style>
  :root {
    --bg:        #0a0a0f;
    --surface:   #12121a;
    --card:      #1a1a28;
    --border:    #2a2a3e;
    --text:      #e4e4ed;
    --muted:     #8888a0;
    --accent:    #6366f1;
    --green:     #22c55e;
    --red:       #ef4444;
    --yellow:    #eab308;
    --radius:    12px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    min-height: 100vh;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
  }
  .header h1 {
    font-size: 22px; font-weight: 600; letter-spacing: -0.3px;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 500;
  }
  .badge-ok   { background:#0f2e1a; color: var(--green); border:1px solid #1a4a2a; }
  .badge-err  { background:#2e0f0f; color: var(--red);   border:1px solid #4a1a1a; }
  .badge-warn { background:#2e2a0f; color: var(--yellow);border:1px solid #4a4a1a; }
  .badge-neutral { background:#1a1a28; color: var(--muted);border:1px solid #2a2a3e; }
  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    margin-bottom: 24px;
  }
  .card {
    background: var(--card); border:1px solid var(--border); border-radius: var(--radius);
    padding: 18px; backdrop-filter: blur(8px);
    transition: border-color .15s;
  }
  .card:hover { border-color: #3a3a5e; }
  .card-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .card-value { font-size: 28px; font-weight: 600; letter-spacing: -.5px; }
  .card-unit  { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 2px; }
  .card-sub   { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .section { margin-bottom: 24px; }
  .section-title {
    font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase;
    letter-spacing: .8px; margin-bottom: 12px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px;
       text-transform: uppercase; letter-spacing: .5px; padding: 8px 12px;
       border-bottom: 1px solid var(--border); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  tr:hover td { background: rgba(99,102,241,.04); }
  .w150 { width: 150px; }
  .right  { text-align: right; }
  .mono   { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace; font-size: 12px; }
  .text-green  { color: var(--green); }
  .text-red    { color: var(--red); }
  .text-yellow { color: var(--yellow); }
  .text-muted  { color: var(--muted); }
  .bar { display: inline-block; height: 6px; border-radius: 3px;
         background: linear-gradient(90deg, var(--accent), #a78bfa); }
  .refresh-bar {
    height: 2px; background: var(--border); border-radius: 1px; margin-top: 16px;
    overflow: hidden;
  }
  .refresh-bar-inner {
    height: 100%; width: 0%; background: var(--accent);
    transition: width 10s linear;
  }
  .log-path   { color: var(--accent); }
  .log-query  { color: var(--muted); font-size: 11px; }
  .log-duration { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>⬡ HORIZN · Monitor</h1>
    <div class="header-sub" id="headerMeta"></div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <span class="badge badge-neutral" id="badgeUptime">⏱ —</span>
    <span class="badge badge-neutral" id="badgePRIM">📡 PRIM —</span>
    <span class="badge badge-neutral" id="badgeGTFS">🗄 GTFS —</span>
</div>
</div>

<div class="grid" id="statsGrid"></div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div>
<div class="section">
  <div class="section-title">📊 Par endpoint</div>
  <table id="endpointTable">
    <thead><tr><th>Route</th><th class="right">Requêtes</th><th class="right">Ø ms</th><th class="right">Erreurs</th></tr></thead>
    <tbody></tbody>
  </table>
</div>
<div class="section">
  <div class="section-title">🗃 Cache</div>
  <table id="cacheTable">
    <thead><tr><th>Fichier</th><th class="right">Taille</th><th class="right">Âge</th></tr></thead>
    <tbody></tbody>
  </table>
</div>
</div>
<div>
<div class="section">
  <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
    <span>📋 Logs récents</span>
    <span style="font-weight:400;text-transform:none;font-size:11px;color:var(--muted)">auto‑refresh 10s</span>
  </div>
  <table id="logTable">
    <thead><tr><th>Heure</th><th>Méthode</th><th>Path</th><th class="right">Ms</th><th>Statut</th></tr></thead>
    <tbody></tbody>
  </table>
  <div class="refresh-bar"><div class="refresh-bar-inner" id="refreshBar"></div></div>
</div>
</div>
</div>

<script>
const API = '/admin';

async function load() {
  const bar = document.getElementById('refreshBar');
  bar.style.transition = 'none'; bar.style.width = '0%';
  requestAnimationFrame(() => {
    bar.style.transition = 'width 10s linear'; bar.style.width = '100%';
  });

  try {
    const resp = await fetch(`${API}/horizn`);
    const data = await resp.json();
    render(data);
    document.getElementById('badgeUptime').className =
      data.health.uptime > 3600 ? 'badge badge-ok' : 'badge badge-neutral';
    document.getElementById('badgeUptime').innerHTML = `⏱ ${data.health.uptimeHuman}`;
    document.getElementById('badgePRIM').className =
      data.health.primReachable ? 'badge badge-ok' : 'badge badge-err';
    document.getElementById('badgePRIM').innerHTML =
      data.health.primReachable ? '📡 PRIM OK' : '📡 PRIM HS';
    document.getElementById('badgeGTFS').className =
      data.health.gtfsDb?.available ? 'badge badge-ok' : 'badge badge-warn';
    document.getElementById('badgeGTFS').innerHTML =
      data.health.gtfsDb?.available ? '🗄 GTFS ' + _fmtBytes(data.health.gtfsDb.sizeBytes) : '🗄 GTFS indisponible';
    document.getElementById('headerMeta').textContent =
      `Démarré ${new Date(data.health.startedAt).toLocaleTimeString('fr-FR')} · ${data.cache.count} fichiers cache`;
  } catch (e) {
    document.getElementById('statsGrid').innerHTML =
      `<div class="card" style="grid-column:1/-1;color:var(--red)">⚠ Erreur de chargement : ${e.message}</div>`;
  }
}

function render(data) {
  const s = data.stats;
  document.getElementById('statsGrid').innerHTML = `
    <div class="card"><div class="card-label">Requêtes aujourd'hui</div>
      <div class="card-value">${s.total}<span class="card-unit"></span></div>
      <div class="card-sub">dont <span class="${s.errors > 0 ? 'text-red' : 'text-green'}">${s.errors} erreur${s.errors > 1 ? 's' : ''}</span></div></div>
    <div class="card"><div class="card-label">Temps moyen</div>
      <div class="card-value">${s.avgDuration}<span class="card-unit">ms</span></div>
      <div class="card-sub">max ${s.maxDuration}ms · min ${s.minDuration}ms</div></div>
    <div class="card"><div class="card-label">Taux d'erreur</div>
      <div class="card-value" class="${s.errorRate === '0%' ? 'text-green' : 'text-red'}">${s.errorRate}</div>
      <div class="card-sub">${s.total - s.errors} OK / ${s.total} total</div></div>
    <div class="card"><div class="card-label">Cache</div>
      <div class="card-value">${data.cache.files.length}<span class="card-unit">fichiers</span></div>
      <div class="card-sub">${_fmtBytes(data.cache.totalSize)}</div></div>
  `;

  // Endpoint table
  const epTbody = document.querySelector('#endpointTable tbody');
  const entries = Object.entries(s.byPath).sort((a,b) => b[1].count - a[1].count);
  epTbody.innerHTML = entries.map(([path, info]) => `
    <tr>
      <td class="mono log-path">${path}</td>
      <td class="right">${info.count}</td>
      <td class="right mono log-duration">${info.count ? Math.round(info.totalDuration / info.count) : 0}</td>
      <td class="right ${info.errors > 0 ? 'text-red' : 'text-green'}">${info.errors}</td>
    </tr>
  `).join('');

  // Cache table
  const cTbody = document.querySelector('#cacheTable tbody');
  cTbody.innerHTML = data.cache.files.map(f => `
    <tr>
      <td class="mono">${f.file}</td>
      <td class="right mono">${_fmtBytes(f.size)}</td>
      <td class="right mono ${f.ageSeconds > 300 ? 'text-yellow' : 'text-green'}">${_fmtAge(f.ageSeconds)}</td>
    </tr>
  `).join('') || '<tr><td colspan="3" class="text-muted">Aucun fichier cache</td></tr>';

  // Log table
  const lTbody = document.querySelector('#logTable tbody');
  lTbody.innerHTML = (data.recentLogs || []).map(l => {
    const cls = l.status >= 500 ? 'text-red' : l.status >= 400 ? 'text-yellow' : 'text-green';
    const qs = l.query ? Object.entries(l.query).filter(([_,v]) => v).map(([k,v]) => `${k}=${v}`).join(' ') : '';
    return `<tr>
      <td class="mono" style="white-space:nowrap">${new Date(l.ts).toLocaleTimeString('fr-FR')}</td>
      <td class="mono">${l.method}</td>
      <td class="mono"><span class="log-path">${l.path}</span>${qs ? '<br><span class="log-query">'+qs+'</span>' : ''}</td>
      <td class="right mono log-duration">${l.duration}</td>
      <td class="right mono ${cls}"><b>${l.status}</b></td>
    </tr>`;
  }).join('');
}

function _fmtBytes(b) {
  if (!b) return '0 B';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(0) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}
function _fmtAge(sec) {
  if (sec < 60) return sec + 's';
  if (sec < 3600) return Math.floor(sec / 60) + 'm ' + (sec % 60) + 's';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  return h + 'h ' + m + 'm';
}

load();
setInterval(load, 10000);
</script>
</body>
</html>
