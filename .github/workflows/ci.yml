name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node.js checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Validate dependency tree
        run: npm ls --all

      - name: Check JavaScript syntax
        run: find js -type f -name '*.js' -print0 | xargs -0 -n 1 node --check

      - name: Smoke test health endpoint
        shell: bash
        run: |
          PORT=3003 QUIET_MODE=1 node js/index.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:3003/health; then
              exit 0
            fi
            sleep 1
          done

          echo "Server did not become ready" >&2
          exit 1

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag horizn-ci .

  release:
    name: Semantic Release
    # Uniquement sur push direct sur main (pas sur les tags, pas sur les PR),
    # et seulement si le reste de la CI passe.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [node, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      # fetch-depth: 0 -> historique complet, nécessaire pour analyser les
      # commits depuis le dernier tag. token: PAT admin -> pousse le commit
      # de release sur main malgré la protection de branche (PR obligatoire),
      # les admins n'étant pas soumis (enforce_admins: false).
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      # semantic-release et ses plugins exigent Node >=22 ; sans rapport avec
      # le runtime de l'app (Node 20, cf. job "Node.js checks" et Dockerfile).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GIT_AUTHOR_NAME: leolesimple
          GIT_AUTHOR_EMAIL: leolesimple@icloud.com
          GIT_COMMITTER_NAME: leolesimple
          GIT_COMMITTER_EMAIL: leolesimple@icloud.com
        run: npx semantic-release

  publish:
    name: Publish image (GHCR)
    # Sur push d'un tag v* uniquement (déclenché par le commit de release
    # ci-dessus), et seulement si le reste de la CI passe.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [node, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
