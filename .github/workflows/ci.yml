name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node.js checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Validate dependency tree
        run: npm ls --all

      - name: Check JavaScript syntax
        run: find js -type f -name '*.js' -print0 | xargs -0 -n 1 node --check

      - name: Smoke test health endpoint
        shell: bash
        run: |
          PORT=3003 QUIET_MODE=1 node js/index.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:3003/health; then
              exit 0
            fi
            sleep 1
          done

          echo "Server did not become ready" >&2
          exit 1

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag horizn-ci .
